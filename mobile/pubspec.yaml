name: sana3y
description: "صنايعي - منصة ربط العملاء بالصنايعية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.8.0
  connectivity_plus: ^6.1.3

  # Local Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.2
  firebase_messaging: ^15.2.2
  cloud_firestore: ^5.6.2

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  badges: ^3.1.2

  # Navigation
  go_router: ^15.1.1

  # Forms & Validation
  flutter_form_builder: ^9.5.1
  form_builder_validators: ^11.1.0
  pin_code_fields: ^8.0.1

  # Location & Maps
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.1
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  photo_view: ^0.15.0
  record: ^5.2.1
  audioplayers: ^6.1.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.3
  device_info_plus: ^11.2.1

  # Socket.io
  socket_io_client: ^3.0.2

  # Other
  flutter_rating_bar: ^4.0.1
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.1.0
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#1E88E5"
  image: assets/icons/splash_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
