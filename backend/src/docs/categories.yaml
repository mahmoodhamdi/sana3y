# Categories API Documentation
paths:
  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories (Admin)
      description: Returns all categories including inactive ones
      security:
        - bearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Categories
      summary: Create category (Admin)
      description: Create a new service category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'

  /categories/active:
    get:
      tags:
        - Categories
      summary: Get active categories
      description: Returns all active categories for public display
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /categories/popular:
    get:
      tags:
        - Categories
      summary: Get popular categories
      description: Returns top categories by request count
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: Popular categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /categories/slug/{slug}:
    get:
      tags:
        - Categories
      summary: Get category by slug
      description: Returns a category by its slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      description: Returns a category by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Categories
      summary: Update category (Admin)
      description: Update an existing category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Category'
    delete:
      tags:
        - Categories
      summary: Delete category (Admin)
      description: Delete a category (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  /categories/reorder:
    put:
      tags:
        - Categories
      summary: Reorder categories (Admin)
      description: Update the display order of categories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
              properties:
                order:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      order:
                        type: integer
      responses:
        '200':
          description: Order updated

  /categories/{id}/subcategories:
    post:
      tags:
        - Categories
      summary: Add subcategory (Admin)
      description: Add a subcategory to a category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nameAr
              properties:
                nameAr:
                  type: string
                nameEn:
                  type: string
                icon:
                  type: string
      responses:
        '201':
          description: Subcategory added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Category'

  /categories/{id}/subcategories/{subcategoryId}:
    put:
      tags:
        - Categories
      summary: Update subcategory (Admin)
      description: Update an existing subcategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: subcategoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nameAr:
                  type: string
                nameEn:
                  type: string
                icon:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Subcategory updated
    delete:
      tags:
        - Categories
      summary: Remove subcategory (Admin)
      description: Remove a subcategory from a category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: subcategoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subcategory removed
