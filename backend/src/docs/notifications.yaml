# Notifications API Documentation
paths:
  /notifications:
    get:
      tags:
        - Notifications
      summary: Get notifications
      description: Returns user's notifications
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [request_new, request_quote, request_accepted, request_completed, request_cancelled, review_received, message_new, system]
        - name: isRead
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Get unread count
      description: Returns count of unread notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      count:
                        type: integer

  /notifications/read-all:
    put:
      tags:
        - Notifications
      summary: Mark all as read
      description: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      markedCount:
                        type: integer

  /notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Mark as read
      description: Mark a single notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked as read
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Delete notification
      description: Delete a notification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/fcm-token:
    post:
      tags:
        - Notifications
      summary: Register FCM token
      description: Register device FCM token for push notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFCMTokenRequest'
      responses:
        '200':
          description: Token registered
    delete:
      tags:
        - Notifications
      summary: Remove FCM token
      description: Remove device FCM token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token removed

  /notifications/broadcast:
    post:
      tags:
        - Notifications
      summary: Broadcast notification (Admin)
      description: Send notification to all users or specific role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '200':
          description: Broadcast sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sentCount:
                        type: integer
        '403':
          $ref: '#/components/responses/ForbiddenError'
